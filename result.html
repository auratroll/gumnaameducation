<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9WMJ3S6YQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V9WMJ3S6YQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumnaam Results - BIEK Karachi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #0b2545;
            --bright-red: #e63946;
            --accent-blue: #134074;
            --bg-color: #ffffff;
            --card-shadow: 0 25px 50px -12px rgba(11, 37, 69, 0.18);
            --wa-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#0b2545 0.75px, transparent 0.75px), radial-gradient(#0b2545 0.75px, #ffffff 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #2b2d42;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: var(--card-shadow);
            border: 2px solid #eef2f6;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--dark-blue), var(--bright-red));
        }

        .top-banner {
            background: #eef2f6;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .top-banner p {
            font-size: 11px;
            font-weight: 600;
            color: var(--dark-blue);
            line-height: 1.3;
        }

        .btn-banner {
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-banner:hover {
            transform: scale(1.05);
            background: #20ba5a;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--dark-blue), var(--bright-red));
            box-shadow: 0 10px 25px rgba(230, 57, 70, 0.25);
            animation: float 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        h1 {
            color: var(--dark-blue);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--dark-blue);
            margin-bottom: 6px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #1a202c;
            outline: none;
            background: #f8fafc;
            transition: all 0.25s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--dark-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(11, 37, 69, 0.1);
        }

        .btn-animated {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #e63946 0%, #b32430 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(230, 57, 70, 0.35), inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-animated::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .btn-animated:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(230, 57, 70, 0.45), inset 0 -4px 0 rgba(0,0,0,0.2);
        }

        .btn-animated:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3), inset 0 -1px 0 rgba(0,0,0,0.2);
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background: #20ba5a;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.4);
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            text-align: left;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box.success {
            background: #ffffff;
            border: 2px solid var(--dark-blue);
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.1);
        }

        .result-box.error {
            background: #fff5f5;
            border: 2px solid var(--bright-red);
            color: #9b1c1c;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 14px;
        }

        .result-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .result-row span.label {
            color: #64748b;
            font-weight: 600;
        }

        .result-row span.value {
            font-weight: 700;
            color: var(--dark-blue);
        }

        .badge-grade {
            background: var(--dark-blue);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="portal-card">

    <div class="top-banner">
        <p>Follow Gumnaam Education channel for more updates</p>
        <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-banner">FOLLOW</a>
    </div>

    <div class="logo-wrapper">
        <div class="logo-container">
            <img src="logo.png" alt="Gumnaam Logo" id="brandLogo">
        </div>
    </div>

    <h1>Gumnaam Results</h1>
    <p class="subtitle">BIEK Karachi Class 12 (HSC Part-II) Annual Examination Results</p>

    <div class="form-group">
        <label>Select Class</label>
        <select id="classSelect">
            <option value="12">Class 12 (HSC Part-II)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Select Faculty / Group</label>
        <select id="facultySelect">
            <option value="XII PRE-ENGINEERING GROUP">Science - XII PRE-ENGINEERING GROUP</option>
        </select>
    </div>

    <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="rollNo" placeholder="Enter Roll No (e.g. 811363)" maxlength="8">
    </div>

    <button class="btn-animated" id="btnSearch" onclick="checkResult()">SEARCH RESULT</button>

    <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-whatsapp">
        📢 Join Official WhatsApp Channel
    </a>

    <div id="resultBox" class="result-box"></div>

    <div class="footer-credit">GUMNAAM EDUCATIONAL PORTAL</div>
</div>

<script>
    const logoImg = document.getElementById('brandLogo');
    logoImg.onerror = function() {
        this.style.display = 'none';
        const container = this.parentElement;
        container.innerHTML = '<span style="color:#fff; font-weight:800; font-size:28px;">G</span>';
    };

    async function checkResult() {
        const rollInput = document.getElementById("rollNo").value.trim();
        const resultDiv = document.getElementById("resultBox");
        const btnSearch = document.getElementById("btnSearch");
        const selectedClass = document.getElementById("classSelect").value;
        const selectedFaculty = document.getElementById("facultySelect").value;

        if (!rollInput) {
            alert("Lutfan Roll Number enter karen!");
            return;
        }

        btnSearch.disabled = true;
        btnSearch.innerText = "SEARCHING...";

        try {
            // Direct streaming fetch for fast reading without freezing
            const response = await fetch('gazette.txt');
            if (!response.ok) throw new Error("File not found");

            const textData = await response.text();

            // Flexible regex: Handles 810603(554), 810603 (554), 810603-554, 810603:554
            const regex = new RegExp(rollInput + "\\s*[\(:-]?\\s*(\\d+)", "i");
            const match = textData.match(regex);

            if (match) {
                const marks = parseInt(match[1]);
                const TOTAL_MARKS = 1100;
                const percentageVal = (marks / TOTAL_MARKS) * 100;
                const percentage = percentageVal.toFixed(2);
                
                let grade = "";
                if (percentageVal >= 80) grade = "A-1 Grade";
                else if (percentageVal >= 70) grade = "A Grade";
                else if (percentageVal >= 60) grade = "B Grade";
                else if (percentageVal >= 50) grade = "C Grade";
                else if (percentageVal >= 40) grade = "D Grade";
                else if (percentageVal >= 33) grade = "E Grade";
                else grade = "FAIL";

                resultDiv.className = "result-box success";
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `
                    <div class="result-row"><span class="label">Roll Number</span><span class="value">${rollInput}</span></div>
                    <div class="result-row"><span class="label">Class</span><span class="value">Class ${selectedClass}</span></div>
                    <div class="result-row"><span class="label">Faculty</span><span class="value">${selectedFaculty}</span></div>
                    <div class="result-row"><span class="label">Marks</span><span class="value">${marks} / ${TOTAL_MARKS}</span></div>
                    <div class="result-row"><span class="label">Percentage</span><span class="value">${percentage}%</span></div>
                    <div class="result-row"><span class="label">Grade</span><span class="badge-grade">${grade}</span></div>
                `;
            } else {
                resultDiv.className = "result-box error";
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<p style="font-size:13px; text-align:center;"><strong>Result Not Found:</strong> Roll Number ${rollInput} gazette mein nahi mila ya candidate Fail/Absent hai.</p>`;
            }
        } catch (err) {
            alert("Gazette file load nahi ho saki! Check karein 'gazette.txt' exact name se uploaded hai.");
            console.error(err);
        } finally {
            btnSearch.disabled = false;
            btnSearch.innerText = "SEARCH RESULT";
        }
    }
</script>

</body>
</html>
