<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9WMJ3S6YQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V9WMJ3S6YQ');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumnaam Results - BIEK Karachi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald-main: #047857;
            --emerald-dark: #065f46;
            --amber-accent: #d97706;
            --bg-color: #f8fafc;
            --card-shadow: 0 25px 50px -12px rgba(4, 120, 87, 0.15);
            --wa-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#047857 0.75px, transparent 0.75px), radial-gradient(#047857 0.75px, #f8fafc 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: var(--card-shadow);
            border: 2px solid #ecfdf5;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--emerald-main), var(--amber-accent));
        }

        .top-banner {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .top-banner p {
            font-size: 11px;
            font-weight: 600;
            color: var(--emerald-dark);
            line-height: 1.3;
        }

        .btn-banner {
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-banner:hover {
            transform: scale(1.05);
            background: #20ba5a;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--emerald-main), var(--amber-accent));
            box-shadow: 0 10px 25px rgba(4, 120, 87, 0.25);
            animation: float 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        h1 {
            color: var(--emerald-dark);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Coming Soon Box Styling */
        .coming-soon-box {
            background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 100%);
            border: 2px dashed var(--emerald-main);
            border-radius: 16px;
            padding: 30px 20px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(4, 120, 87, 0.08);
        }

        .ready-badge {
            display: inline-block;
            background: var(--amber-accent);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .faculty-title {
            color: var(--emerald-dark);
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .status-text {
            color: var(--emerald-main);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background: #20ba5a;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.4);
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="portal-card">

    <div class="top-banner">
        <p>Follow Gumnaam Education channel for more updates</p>
        <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-banner">FOLLOW</a>
    </div>

    <div class="logo-wrapper">
        <div class="logo-container">
            <img src="logo.png" alt="Gumnaam Logo" id="brandLogo">
        </div>
    </div>

    <h1>Gumnaam Results</h1>
    <p class="subtitle">BIEK Karachi Class 12 (HSC Part-II) Annual Examination Results</p>

    <!-- Coming Soon Section -->
    <div class="coming-soon-box">
        <div class="ready-badge">BE READY...!!!</div>
        <div class="faculty-title">XII SCI GENERAL (C.S) RESULTS</div>
        <div class="status-text">COMING SOON......</div>
    </div>

    <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-whatsapp">
        📢 Join Official WhatsApp Channel
    </a>

    <div class="footer-credit">GUMNAAM EDUCATIONAL PORTAL</div>
</div>

<script>
    const logoImg = document.getElementById('brandLogo');
    logoImg.onerror = function() {
        this.style.display = 'none';
        const container = this.parentElement;
        container.innerHTML = '<span style="color:#fff; font-weight:800; font-size:28px;">G</span>';
    };
</script>

</body>
</html>
