<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9WMJ3S6YQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V9WMJ3S6YQ');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumnaam Results - BIEK Karachi</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Theme Colors from Logo */
            --main-dark: #1B3625;
            --main-light: #A6C665;
            --cream-bg: #F1EDD4;
            --bg-color: #ffffff;
            --wa-green: #25D366;
            --card-shadow: 0 25px 50px -12px rgba(27, 54, 37, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Times New Roman Font Applied */
            font-family: 'Times New Roman', Times, serif; 
        }

        body {
            background-color: var(--bg-color); /* Pure White Background */
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--cream-bg);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--main-dark), var(--main-light));
        }

        .top-banner {
            background: var(--cream-bg);
            border: 1px solid var(--main-light);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .top-banner p {
            font-size: 12px;
            font-weight: bold;
            color: var(--main-dark);
            line-height: 1.3;
        }

        .btn-banner {
            background: var(--main-dark);
            color: var(--cream-bg);
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(27, 54, 37, 0.2);
            transition: all 0.2s ease;
        }

        .btn-banner:hover {
            transform: scale(1.05);
            background: #122519;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--main-dark), var(--main-light));
            box-shadow: 0 10px 25px rgba(27, 54, 37, 0.25);
            animation: float 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        h1 {
            color: var(--main-dark);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--main-dark);
            margin-bottom: 6px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--cream-bg);
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            color: var(--main-dark);
            outline: none;
            background: #f8fafc;
            transition: all 0.25s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--main-light);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(166, 198, 101, 0.2);
        }

        .btn-animated {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, var(--main-dark) 0%, #122519 100%);
            color: var(--cream-bg);
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(27, 54, 37, 0.35), inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-animated::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .btn-animated:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(27, 54, 37, 0.45), inset 0 -4px 0 rgba(0,0,0,0.2);
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background: #20ba5a;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.4);
        }

        /* Result Box Styling (Completed) */
        .result-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            text-align: left;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box.success {
            background: #ffffff;
            border: 2px solid var(--main-light);
            box-shadow: 0 10px 30px rgba(166, 198, 101, 0.2);
        }

        .result-box.error {
            background: #fff5f5;
            border: 2px solid #ef4444;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            font-weight: bold;
            color: var(--main-dark);
            text-decoration: none;
            border-bottom: 2px solid var(--main-light);
            padding-bottom: 2px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--main-light);
            border-bottom-color: var(--main-dark);
        }
    </style>
</head>
<body>

    <div class="portal-card">
        
        <!-- Top Banner -->
        <div class="top-banner">
            <p>Latest educational updates &<br>result announcements.</p>
            <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-banner">Join WhatsApp</a>
        </div>

        <!-- Logo -->
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="logo.png" alt="Logo">
            </div>
        </div>

        <h1>Result Portal</h1>
        <p class="subtitle">Check your BIEK Karachi board results instantly.</p>

        <!-- Search Form -->
        <form id="result-form">
            <div class="form-group">
                <label for="group">Select Group</label>
                <select id="group" required>
                    <option value="" disabled selected>Choose your group</option>
                    <option value="Pre-Engineering">Pre-Engineering</option>
                    <option value="Pre-Medical">Pre-Medical</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Commerce">Commerce</option>
                </select>
            </div>

            <div class="form-group">
                <label for="roll-no">Roll Number</label>
                <input type="text" id="roll-no" placeholder="Enter your 6-digit roll number" required pattern="[0-9]{1,10}">
            </div>

            <button type="submit" class="btn-animated" id="submit-btn">
                <i class="fa-solid fa-magnifying-glass"></i> Check Result
            </button>
        </form>

        <a href="https://whatsapp.com/channel/0029Vam5DGJBPzjSPNeP7N1s" target="_blank" class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp text-xl"></i> Get Results on WhatsApp
        </a>

        <!-- Result Display Area -->
        <div id="result-box" class="result-box">
            <div id="result-content"></div>
        </div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-house mr-1"></i> Back to Homepage</a>

    </div>

    <!-- JavaScript Logic to Fetch gazette.txt -->
    <script>
        document.getElementById('result-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rollNo = document.getElementById('roll-no').value.trim();
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');
            const btn = document.getElementById('submit-btn');

            if (!rollNo) return;

            // Show loading UI
            resultBox.style.display = 'block';
            resultBox.className = 'result-box'; // Reset classes
            resultContent.innerHTML = '<div style="text-align: center; color: var(--main-dark); font-weight: bold;"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Fetching gazette data...</div>';
            
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
            btn.disabled = true;

            try {
                // Fetching the gazette.txt file from the server
                const response = await fetch('gazette.txt');
                
                if (!response.ok) {
                    throw new Error('Gazette file is not available right now. Please try again later.');
                }
                
                const textData = await response.text();
                
                // Checking if the roll number is present inside the gazette text
                if (textData.includes(rollNo)) {
                    resultBox.classList.add('success');
                    resultContent.innerHTML = `
                        <h3 style="color: var(--main-dark); font-weight: 800; font-size: 18px; margin-bottom: 8px; text-transform: uppercase;">
                            <i class="fa-solid fa-circle-check" style="color: var(--main-light);"></i> Result Found!
                        </h3>
                        <p style="color: #333; font-size: 14px; font-weight: bold;">
                            Roll Number: <span style="color: var(--main-dark);">${rollNo}</span>
                        </p>
                        <p style="color: var(--main-dark); font-size: 13px; margin-top: 5px; font-weight: bold;">
                            Congratulations! Your roll number is present in the passing gazette.
                        </p>
                    `;
                } else {
                    resultBox.classList.add('error');
                    resultContent.innerHTML = `
                        <h3 style="color: #ef4444; font-weight: 800; font-size: 18px; margin-bottom: 8px; text-transform: uppercase;">
                            <i class="fa-solid fa-circle-xmark"></i> Not Found
                        </h3>
                        <p style="color: #333; font-size: 14px; font-weight: bold;">
                            Roll Number: <span style="color: #ef4444;">${rollNo}</span>
                        </p>
                        <p style="color: #ef4444; font-size: 13px; margin-top: 5px; font-weight: bold;">
                            Sorry, your roll number was not found in the gazette list.
                        </p>
                    `;
                }
            } catch (error) {
                resultBox.classList.add('error');
                resultContent.innerHTML = `
                    <h3 style="color: #ef4444; font-weight: 800; font-size: 16px; margin-bottom: 5px;">Error</h3>
                    <p style="color: #ef4444; font-size: 13px; font-weight: bold;">${error.message}</p>
                `;
            } finally {
                // Restore button state
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
