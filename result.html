    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --emerald-main: #047857;
            --emerald-dark: #065f46;
            --amber-accent: #d97706;
            --bg-color: #f8fafc;
            --card-shadow: 0 25px 50px -12px rgba(4, 120, 87, 0.15);
            --wa-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Changed to VIP Theme Font */
            font-family: 'Times New Roman', Times, serif; 
        }

        /* Removed flex from body to allow header/footer to sit properly */
        body {
            color: #1e293b;
        }

        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: var(--card-shadow);
            border: 2px solid #ecfdf5;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--emerald-main), var(--amber-accent));
        }

        .top-banner {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .top-banner p {
            font-size: 11px;
            font-weight: 600;
            color: var(--emerald-dark);
            line-height: 1.3;
        }

        .btn-banner {
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-banner:hover {
            transform: scale(1.05);
            background: #20ba5a;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--emerald-main), var(--amber-accent));
            box-shadow: 0 10px 25px rgba(4, 120, 87, 0.25);
            animation: float 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        h1 {
            color: var(--emerald-dark);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--emerald-dark);
            margin-bottom: 6px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #0f172a;
            outline: none;
            background: #f8fafc;
            transition: all 0.25s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--emerald-main);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(4, 120, 87, 0.1);
        }

        .btn-animated {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, var(--emerald-main) 0%, var(--emerald-dark) 100%);
            color: #fef3c7;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(4, 120, 87, 0.35), inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-animated::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .btn-animated:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(4, 120, 87, 0.45), inset 0 -4px 0 rgba(0,0,0,0.2);
        }

        .btn-animated:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(4, 120, 87, 0.3), inset 0 -1px 0 rgba(0,0,0,0.2);
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--wa-green);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background: #20ba5a;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.4);
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            text-align: left;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box.success {
            background: #ffffff;
            border: 2px solid var(--emerald-main);
            box-shadow: 0 10px 30px rgba(4, 120, 87, 0.1);
        }

        .result-box.error {
            background: #fff5f5;
            border: 2px solid #e63946;
            color: #9b1c1c;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 14px;
        }

        .result-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .result-row span.label {
            color: #64748b;
            font-weight: 600;
        }

        .result-row span.value {
            font-weight: 700;
            color: var(--emerald-dark);
        }

        .badge-grade {
            background: var(--emerald-main);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
        }

        .badge-rank {
            background: var(--amber-accent);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
